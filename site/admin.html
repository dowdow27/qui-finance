<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Modération des débats</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <h2>Modération des débats</h2>
  <p class="note">Rien n'est publié sans validation ici. Refusez toute accusation non étayée, attaque personnelle ou atteinte à la vie privée.</p>
  <form id="login" class="filters">
    <input type="password" id="tok" placeholder="Jeton de modération" aria-label="Jeton de modération" autocomplete="current-password">
    <button class="btn">Ouvrir</button>
    <button class="btn ghost" type="button" id="logout">Oublier le jeton</button>
  </form>
  <p class="summary" id="msg" role="status"></p>
  <div id="out"></div>
</main>
<script src="config.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const API = window.QF?.API || "";
const store = { get: () => { try { return localStorage.getItem("qf-admin") || ""; } catch { return ""; } }, set: (v) => { try { v ? localStorage.setItem("qf-admin", v) : localStorage.removeItem("qf-admin"); } catch {} } };
let TOKEN = store.get();

async function call(path, data) {
  const r = await fetch(API + path, { method: data ? "POST" : "GET", headers: { Authorization: `Bearer ${TOKEN}`, "Content-Type": "application/json" }, body: data ? JSON.stringify(data) : undefined });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(out.erreur || `erreur ${r.status}`);
  return out;
}
const refs = (rs) => rs.map((r) => `<a class="chip ref" href="./#${r.type === "classement" ? "tendances:" + encodeURIComponent(r.key) : "chercher:" + encodeURIComponent(r.label)}" target="_blank"><small>${esc(r.type)}</small> ${esc(r.label)}</a>`).join(" ");
const actions = (t, id, pub) => pub
  ? `<button class="btn ghost" data-act="supprimer" data-t="${t}" data-id="${id}">Supprimer</button>`
  : `<button class="btn" data-act="publier" data-t="${t}" data-id="${id}">Publier</button> <button class="btn ghost" data-act="refuser" data-t="${t}" data-id="${id}">Refuser</button>`;

async function load() {
  if (!API) { $("#msg").textContent = "API non configurée (site/config.js)."; return; }
  if (!TOKEN) { $("#msg").textContent = "Entrez le jeton de modération."; $("#out").innerHTML = ""; return; }
  $("#msg").textContent = "Chargement…";
  try {
    const f = await call("/admin/file");
    $("#msg").textContent = `${f.hypotheses.length} hypothèse(s) et ${f.commentaires.length} commentaire(s) en attente.`;
    $("#out").innerHTML = `<h3>Hypothèses en attente</h3>${f.hypotheses.map((h) => `<div class="hypo"><div></div><div class="hypo-body"><h3>${esc(h.titre)}</h3><p class="meta">${esc(h.pseudo)}, ${esc(h.cree_le)} UTC</p><p class="texte">${esc(h.texte)}</p><div class="chips">${refs(h.refs)}</div>${actions("hypotheses", h.id)}</div></div>`).join("") || "<p class='note'>Rien.</p>"}
      <h3>Commentaires en attente</h3>${f.commentaires.map((c) => `<div class="hypo"><div></div><div class="hypo-body"><p class="meta">${esc(c.pseudo)}, ${esc(c.cree_le)} UTC, sur « ${esc(c.hypothese)} »</p><p class="texte">${esc(c.texte)}</p>${actions("commentaires", c.id)}</div></div>`).join("") || "<p class='note'>Rien.</p>"}
      <h3>Sondages (question de la semaine)</h3>${(f.sondages || []).map((x) => `<p class="summary">${esc(x.question)} : ${x.oui} oui, ${x.non} non</p>`).join("") || "<p class='note'>Aucun vote.</p>"}
      <h3>Publiées (100 dernières)</h3>${f.publiees.map((h) => `<div class="hypo"><div class="votebox"><b class="score">${h.score}</b></div><div class="hypo-body"><h3>${esc(h.titre)}</h3><p class="meta">${esc(h.pseudo)}, ${esc(h.publie_le)} UTC · ${h.pour} pour, ${h.contre} contre, ${h.n_com} commentaire(s)</p><div class="chips">${refs(h.refs)}</div>${actions("hypotheses", h.id, true)}</div></div>`).join("") || "<p class='note'>Rien.</p>"}`;
  } catch (e) { $("#msg").textContent = `Impossible de charger : ${e.message}.`; $("#out").innerHTML = ""; }
}
$("#login").addEventListener("submit", (ev) => { ev.preventDefault(); TOKEN = $("#tok").value.trim(); store.set(TOKEN); $("#tok").value = ""; load(); });
$("#logout").addEventListener("click", () => { TOKEN = ""; store.set(""); load(); });
$("#out").addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act; let motif = "";
  if (act === "refuser" && (motif = prompt("Motif du refus (interne) :")) === null) return;
  if (act === "supprimer" && !confirm("Supprimer définitivement, avec ses votes et commentaires ?")) return;
  b.disabled = true;
  try { await call(`/admin/${b.dataset.t}/${b.dataset.id}`, { action: act, motif }); load(); }
  catch (e) { $("#msg").textContent = `Action impossible : ${e.message}.`; b.disabled = false; }
});
load();
</script>
</body>
</html>
