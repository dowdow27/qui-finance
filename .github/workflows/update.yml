name: Mise à jour hebdomadaire

on:
  schedule:
    - cron: "0 7 * * 1"   # lundi 07:00 UTC, après l'export Lobbywatch (lundi matin) et le miroir CDF (samedi)
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]
    paths: ["site/**", "config/**", "scripts/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # le premier rattrapage des votes nominaux prend quelques minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Télécharger et préparer les registres
        run: python scripts/build.py

      - name: Enregistrer les données dans le dépôt (historique)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add site/data history
          git diff --staged --quiet || git commit -m "Données du $(date -u +%F)"
          # Un autre run a pu commiter ses données entre-temps : en cas de conflit, garder celles de ce run (« theirs » = notre commit rejoué)
          git pull --rebase -X theirs origin main
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
